# =========================================================
# Pennywise - Production Profile Configuration
# Activated with SPRING_PROFILES_ACTIVE=prod
# Strict security: Credentials MUST be provided via environment variables.
# =========================================================

# Database: Environment-provided credentials required (no default fallbacks)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT Security: Dedicated strong secret required
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS: Production frontend origin required
cors.allowed-origins=${CORS_ORIGINS}
