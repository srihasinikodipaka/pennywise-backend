spring.application.name=pennywise
server.port=${PORT:8080}

# Active profile: defaults to 'dev' for seamless local development
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# MySQL Database Configuration (Local development defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pennywise_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security
# Local development default key (at least 256 bits). In production (SPRING_PROFILES_ACTIVE=prod),
# JWT_SECRET must be explicitly supplied as an environment variable and cannot use this default.
jwt.secret=${JWT_SECRET:dev_only_insecure_jwt_secret_key_minimum_32_bytes_long_pennywise_development!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
